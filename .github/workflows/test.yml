name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest

      - name: Set up Node for badge checks
        if: matrix.python-version == '3.13'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check browser badge behavior
        if: matrix.python-version == '3.13'
        run: node tests/test_recency_badges.cjs

      - name: Build and install wheel
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python -m pip uninstall -y dtupper-site-generator
          python -m pip install --no-deps dist/*.whl

      - name: Smoke test installed CLI outside checkout
        run: |
          cd "$(mktemp -d)"
          python "$GITHUB_WORKSPACE/scripts/smoke_installed.py"

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
