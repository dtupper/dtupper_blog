{% extends "base.html" %}

{% block title %}{{ metadata.title }}{% endblock %}

{% block description %}{{ metadata.description or site.description }}{% endblock %}

{% block content %}
<article class="page">
    <header class="page-header">
        <h1>{{ metadata.title }}</h1>
    </header>

    <div class="page-content prose">
        {{ body|safe }}
    </div>

    {% include "partials/diff_viewer.html" %}
</article>
{% endblock %}
