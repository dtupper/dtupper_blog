<footer class="site-footer">
    <div class="footer-content">
        <p>&copy; {{ now.year }} {{ site.author }}. All rights reserved.</p>
        {% if has_feed %}
        <p><a href="{{ site_url('feed.xml') }}">RSS</a></p>
        {% endif %}
        <p class="build-info">
            Built <time class="build-time" datetime="{{ build_time.strftime('%Y-%m-%dT%H:%M:%SZ') }}">{{ build_time.strftime('%d %b %Y %I:%M:%S %p') }} UTC</time>{% if build_hash %} · {{ build_hash }}{% endif %}
        </p>
    </div>
    <script>
    document.querySelectorAll('.build-time').forEach(function(el) {
        var d = new Date(el.getAttribute('datetime'));
        el.textContent = d.toLocaleDateString(undefined, {day:'numeric',month:'short',year:'numeric'})
            + ' ' + d.toLocaleTimeString(undefined, {hour:'numeric',minute:'2-digit',second:'2-digit',timeZoneName:'short'});
    });
    </script>
</footer>
