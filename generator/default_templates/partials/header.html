<header class="site-header">
    <div class="header-content">
        <a href="{{ site_url('/') }}" class="site-title">{{ site.title }}</a>
        <nav class="main-nav">
            {% for item in navigation %}
            <a href="{{ site_url(item.url) }}">{{ item.label }}</a>
            {% endfor %}
        </nav>
    </div>
</header>
