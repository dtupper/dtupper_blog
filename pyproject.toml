[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dtupper-site-generator"
version = "2.1.1"
description = "Static site generator with rich media embed support"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "David Tupper"}
]

dependencies = [
    "markdown>=3.5",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "python-slugify>=8.0",
    "babel>=2.14",
    "feedgen>=1.0",
    "pygments>=2.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=24.0",
    "ruff>=0.1",
]

[project.scripts]
build-site = "generator.build:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["generator*"]

[tool.setuptools.package-data]
generator = [
    "default_templates/**/*.html",
    "default_static/**/*",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
